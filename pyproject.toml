[project]
name = "context-lens"
version = "0.1.0"
description = "Semantic & AST Context Pruner for LLM Coding Agents"
authors = [{name = "Nicodemus", email = "demusraph@example.com"}]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"